[server]
# Yalnız bu bilgisayardan erişim (yerel prototip).
address = "localhost"
port = 8501

[client]
# Demo ekranında "Deploy" gibi geliştirici düğmelerini gizler.
toolbarMode = "minimal"

[browser]
# Streamlit kullanım istatistiği gönderilmez.
gatherUsageStats = false

[theme]
# Varsayılan koyu (lacivert/antrasit); açık tema ⋮ → Settings → Theme ile seçilir.
base = "dark"
primaryColor = "#14B8A6"
font = "sans-serif"
chartCategoricalColors = ["#14B8A6", "#38BDF8", "#8B5CF6", "#F59E0B", "#EF4444", "#22C55E"]

[theme.dark]
primaryColor = "#14B8A6"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111C2E"
textColor = "#E2E8F0"
borderColor = "#1E2A40"

[theme.dark.sidebar]
backgroundColor = "#0E1729"

[theme.light]
primaryColor = "#0D9488"
backgroundColor = "#F6F8FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
borderColor = "#E2E8F0"

[theme.light.sidebar]
backgroundColor = "#EEF2F7"
