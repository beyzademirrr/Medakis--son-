# MedAkis PostgreSQL migrations. There is no database URL or password in this file.
# The target database is mandatory and the owner role comes from the credential store:
#   .\.venv\Scripts\python.exe -m alembic -x db=medakis_test upgrade head

[alembic]
script_location = %(here)s/migrations_pg
prepend_sys_path = src
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
