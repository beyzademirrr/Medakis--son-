# MedAkis yerel PostgreSQL servisi (yalnız sentetik veri, yalnız bu bilgisayar).
#
# Parola bu dosyada veya .env içinde tutulmaz. Süper kullanıcı parolası yalnız volume
# ilk kez oluşturulurken gerekir ve scripts/db/setup.ps1 ile gizli girişten alınır.
# Sonraki başlatmalarda değişken boştur. Veri dizini varsa imaj bu değeri kullanmaz;
# volume boşsa imaj parolasız başlamayı reddeder (güvenli başarısızlık).
name: medakis

services:
  postgres:
    # Sürüm etiketi okunabilirlik, digest tekrar üretilebilirlik içindir.
    image: postgres:18.6-trixie@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
    container_name: medakis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${MEDAKIS_PG_SUPERUSER_PASSWORD:-}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      # Yalnız loopback: yerel ağdan erişilemez.
      - "127.0.0.1:${MEDAKIS_PG_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 imajında PGDATA=/var/lib/postgresql/18/docker; volume üst dizine bağlanır.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1: ilk kurulumdaki geçici sunucu yalnız soket dinlediği için "hazır" sayılmaz.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "postgres", "-d", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
    name: medakis_pgdata
